#:schema https://mise.jdx.dev/schema/mise.json

# Includes the v2 global-lockfile symlink fix; keep installers at least this new.
min_version = "2026.9.12"

[settings]
experimental = true
lockfile = true
locked_verify_provenance = true
# V2 sidecars freeze npm/aube and Python/uv dependency graphs.
locked = true

# Optional “paranoid” hardening + signature verification
paranoid = true   # extra-secure behavior (hooks/tasks etc.) :contentReference[oaicite:8]{index=8}
gpg_verify = true # verify signatures for supported tools :contentReference[oaicite:9]{index=9}

[settings.aqua]
baked_registry = true
cosign = true
minisign = true
slsa = true

[settings.github]
credential_command = "ghtkn get -m 1h"

[settings.npm]
package_manager = "aube"

[env]
FACTORY_DROID_AUTO_UPDATE_ENABLED = "false"
OPENCODE_DISABLE_AUTOUPDATE = "1"

[tools]

bun = "1.4.2"
go = "1.27.1"
node = "24.21.0"
rust = "1.98.1"
usage = "6.10.0"

