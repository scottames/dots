# Colors only. Structure lives in ~/.config/tmux/conf/skin_shared.conf.
# color_fg is the status-bar background; color_bg is text drawn on an accent.
color_bg="{{ .bg }}"
color_fg="{{ .bg_alt }}"
color_green="{{ .green }}"
color_yellow="{{ .yellow }}"
color_red="{{ .red }}"
color_blue="{{ .blue }}"
color_cyan="{{ .cyan }}"
color_purple="{{ .accent }}"
color_gray="{{ .muted }}"
color_buffer="{{ .fg }}"
color_selection="{{ .selection }}"
