# Colors only. `[icon]` is deliberately omitted so yazi's built-in icon set
# applies — icons are structure, not palette, and duplicating them per theme is
# what this split exists to avoid. Syntax highlighting in previews falls back to
# yazi's bundled theme for the same reason.

[mgr]
cwd = { fg = "{{ .cyan }}" }

find_keyword = { fg = "{{ .yellow }}", bold = true, italic = true, underline = true }
find_position = { fg = "{{ .pink }}", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "{{ .green }}", bg = "{{ .green }}" }
marker_cut = { fg = "{{ .red }}", bg = "{{ .red }}" }
marker_marked = { fg = "{{ .cyan }}", bg = "{{ .cyan }}" }
marker_selected = { fg = "{{ .yellow }}", bg = "{{ .yellow }}" }

count_copied = { fg = "{{ .bg }}", bg = "{{ .green }}" }
count_cut = { fg = "{{ .bg }}", bg = "{{ .red }}" }
count_selected = { fg = "{{ .bg }}", bg = "{{ .yellow }}" }

border_symbol = "│"
border_style = { fg = "{{ .border }}" }

[tabs]
active = { fg = "{{ .bg }}", bg = "{{ .accent }}", bold = true }
inactive = { fg = "{{ .accent }}", bg = "{{ .bg_alt }}" }

[mode]
normal_main = { fg = "{{ .bg }}", bg = "{{ .accent }}", bold = true }
normal_alt = { fg = "{{ .accent }}", bg = "{{ .bg_alt }}" }
select_main = { fg = "{{ .bg }}", bg = "{{ .cyan }}", bold = true }
select_alt = { fg = "{{ .cyan }}", bg = "{{ .bg_alt }}" }
unset_main = { fg = "{{ .bg }}", bg = "{{ .pink }}", bold = true }
unset_alt = { fg = "{{ .pink }}", bg = "{{ .bg_alt }}" }

[status]
perm_sep = { fg = "{{ .muted }}" }
perm_type = { fg = "{{ .blue }}" }
perm_read = { fg = "{{ .yellow }}" }
perm_write = { fg = "{{ .red }}" }
perm_exec = { fg = "{{ .green }}" }

progress_label = { fg = "{{ .fg }}", bold = true }
progress_normal = { fg = "{{ .green }}", bg = "{{ .selection }}" }
progress_error = { fg = "{{ .yellow }}", bg = "{{ .red }}" }

[pick]
border = { fg = "{{ .accent }}" }
active = { fg = "{{ .pink }}", bold = true }
inactive = {}

[input]
border = { fg = "{{ .accent }}" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "{{ .accent }}" }

[tasks]
border = { fg = "{{ .accent }}" }
title = {}
hovered = { fg = "{{ .pink }}", bold = true }

[which]
border = { fg = "{{ .accent }}" }
cand = { fg = "{{ .cyan }}" }
rest = { fg = "{{ .muted }}" }
desc = { fg = "{{ .pink }}" }
separator = "  "
separator_style = { fg = "{{ .border }}" }

[help]
on = { fg = "{{ .cyan }}" }
run = { fg = "{{ .pink }}" }
hovered = { reversed = true, bold = true }
footer = { fg = "{{ .bg_alt }}", bg = "{{ .fg }}" }

[spot]
border = { fg = "{{ .accent }}" }
title = { fg = "{{ .accent }}" }
tbl_col = { fg = "{{ .cyan }}" }
tbl_cell = { fg = "{{ .pink }}", bg = "{{ .selection }}" }

[notify]
title_info = { fg = "{{ .green }}" }
title_warn = { fg = "{{ .yellow }}" }
title_error = { fg = "{{ .red }}" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "{{ .cyan }}" },
  { mime = "**/{audio,video}/*", fg = "{{ .yellow }}" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{ .pink }}" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "{{ .green }}" },
  { mime = "vfs/{absent,stale}", fg = "{{ .muted }}" },
  { url = "*", fg = "{{ .fg }}" },
  { url = "*/", fg = "{{ .accent }}" },
]
