---
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
git:
  overrideGpg: true
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  autoFetch: false
customCommands:
  - key:
      - "<alt-g>"
      - "X"
    description: GitHub Stack
    commandMenu:
      - key: v
        context: global
        description: View stack (short)
        command: gh stack view --short
        output: popup
        outputTitle: GitHub stack
      - key: J
        context: global
        description: View stack (JSON)
        command: gh stack view --json
        output: popup
        outputTitle: GitHub stack JSON
      - key: a
        context: global
        description: Add stack layer
        command: gh stack add
        output: terminal
        prompts:
          - type: confirm
            title: Add stack layer
            body: Add a new branch on top of the current stack layer?
      - key: k
        context: global
        description: Move up stack
        command: gh stack up
        output: log
      - key: j
        context: global
        description: Move down stack
        command: gh stack down
        output: log
      - key: t
        context: global
        description: Move to stack top
        command: gh stack top
        output: log
      - key: b
        context: global
        description: Move to stack bottom
        command: gh stack bottom
        output: log
      - key: r
        context: global
        description: Rebase stack
        command: gh stack rebase
        output: terminal
        prompts:
          - type: confirm
            title: Rebase stack
            body: Rebase the current stack?
        after:
          checkForConflicts: true
      - key: s
        context: global
        description: Sync stack
        command: gh stack sync
        output: terminal
        prompts:
          - type: confirm
            title: Sync stack
            body: Synchronize the local stack with its remotes?
      - key: u
        context: global
        description: Submit stack PRs
        command: gh stack submit --auto
        output: terminal
        prompts:
          - type: confirm
            title: Submit stack PRs
            body: Create or update pull requests for this stack?
      - key: m
        context: global
        description: Explicitly merge stack
        command: gh stack merge --yes
        output: terminal
        prompts:
          - type: confirm
            title: Merge stack
            body: Explicitly merge this stack?
