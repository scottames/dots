# https://worktrunk.dev/config/
# Stax owns worktree lifecycle and metadata; Worktrunk supplies copy-ignored.

worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"
skip-shell-integration-prompt = true

[list.custom-columns.Task]
template = "{{ vars.task }}"
width = 32
priority = 2

[list.custom-columns.Agent]
template = "{{ vars.agent }}"
width = 10
priority = 3

[aliases]
pane = '''
wt \
  --config-set 'list.columns=["branch","status","ci","age","message"]' \
  list --full --no-progressive
'''
pane-with-task = '''
wt \
  --config-set 'list.columns=["branch","status","ci","Task","Agent","age","message"]' \
  list --full --no-progressive
'''
# no upstream
pane-fast = '''
wt \
  --config-set 'list.columns=["branch","status","working-diff","ahead-behind","upstream","age"]' \
  list --no-progressive
'''
pane-watch = '''
trap 'printf "\033[?25h"' EXIT INT TERM
printf '\033[?25l\033[2J'

while :; do
  printf '\033[H'
  wt pane || true
  printf '\033[J'
  sleep 10
done
'''
pane-watch-with-task = '''
trap 'printf "\033[?25h"' EXIT INT TERM
printf '\033[?25l\033[2J'

while :; do
  printf '\033[H'
  wt pane || true
  printf '\033[J'
  sleep 10
done
'''
