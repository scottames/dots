[branch]
date = false
date_format = "%m-%d"
replacement = "-"
lowercase = true
stale_days = 30

[remote]
name = "origin"
base_url = "https://github.com"
auto_fork = false

[submit]
stack_links = "comment"
native_stack = "auto"
stack_links_when_native = "keep"
single_stack = "on"
commit_messages_in_body = true

[ci]
alert = true

[ui]
tips = true

[display]
worktree_glyph = "tree"

[ai.generate]
agent = "codex"
model = "gpt-6-luna"

[ai.standup]
agent = "codex"
model = "gpt-6-luna"

[ai.resolve]
agent = "codex"
model = "gpt-6-luna"

[ai.lane]
agent = "opencode"
model = "openai/gpt-6-sol"

[auth]
use_gh_cli = true
allow_github_token_env = false

[worktree]
root_dir = ".."
# Stable branch/path identities are important to Herdr and existing sessions.
reuse_slots = false

[worktree.hooks]
# Blocking: setup failures must be visible before opening an agent/terminal.
post_create = """
set -e
python3 "$HOME/.config/stax/copy-ignored.py"
if command -v thts >/dev/null 2>&1; then
  thts init --no-agents --force
fi
if test -f .trunk/trunk.yaml; then
  trunk check
fi
"""

[git]
rerere = true

[restack]
preflight_auto_repair = true
preflight_warn = true

[skills]
# Unset = auto (detected + already installed).
# harnesses = ["claude", "codex", "opencode", "pi"]

[board]
mine_only = true
