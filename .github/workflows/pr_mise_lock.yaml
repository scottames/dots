---
name: mise
on:
  pull_request:
    paths:
      - .github/workflows/pr_mise_lock.yaml
      - mise/config.toml
      - mise/mise.lock
      - mise/.mise/locks/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    if: "! github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - name: Generate GitHub token
        # https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.12
          install: false
          # Lock generation needs no exported tool paths from the stale lock.
          env: false
          cache: false
          github_token: ${{ steps.generate-token.outputs.token }}
      - name: mise lock
        env:
          MISE_LOCKED: 0 # disable "locked=true" for update
        run: |
          mise install aqua:astral-sh/uv
          mise lock
      - name: push lockfile changes
        uses: IAreKyleW00t/verified-bot-commit@42a042b0407248f3c0acac00c389e729e3476e86 # v2.3.5
        id: commit
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          message: "chore(mise): lock"
          files: |
            mise/mise.lock
            mise/.mise/locks/**
          if-no-commit: notice
          update-local: false
      - name: require checks on updated lockfile
        if: steps.commit.outputs.ref != ''
        run: |
          echo "::notice ::Lockfile changes pushed; checks will run on the new commit"
          exit 1
