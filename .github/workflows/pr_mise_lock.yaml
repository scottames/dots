---
name: mise
on:
  pull_request:
    paths:
      - .github/workflows/pr_mise_lock.yaml
      - mise/config.toml
      - mise/mise.lock
      - mise/.mise/locks/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    if: "! github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - name: Generate GitHub token
        # https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.12
          install: false
          # Lock generation needs no exported tool paths from the stale lock.
          env: false
          cache: false
          github_token: ${{ steps.generate-token.outputs.token }}
      - name: mise lock
        env:
          MISE_LOCKED: 0 # disable "locked=true" for update
        run: |
          mise install aqua:astral-sh/uv
          mise lock
      - name: push lockfile changes
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          paths=(mise/mise.lock mise/.mise/locks)
          git add --all -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo "::notice ::No lockfile changes"
            exit 0
          fi
          python3 - "${paths[@]}" > "${RUNNER_TEMP}/mise-commit.json" <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args])

          changes = git("diff", "--cached", "--no-renames", "--name-status", "-z",
                        "--", *sys.argv[1:]).split(b"\0")[:-1]
          additions, deletions = [], []
          for status, raw_path in zip(changes[::2], changes[1::2]):
              path = raw_path.decode("utf-8")
              if status == b"D":
                  deletions.append({"path": path})
              else:
                  content = base64.b64encode(git("show", ":" + path)).decode("ascii")
                  additions.append({"path": path, "contents": content})
          payload = {
              "branch": {"repositoryNameWithOwner": os.environ["GH_REPO"],
                         "branchName": os.environ["PR_BRANCH"]},
              "expectedHeadOid": git("rev-parse", "HEAD").decode().strip(),
              "message": {"headline": "chore(mise): lock"},
              "fileChanges": {"additions": additions, "deletions": deletions},
          }
          query = """mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { url } }
          }"""
          json.dump({"query": query, "variables": {"input": payload}}, sys.stdout)
          PY
          gh api graphql --input "${RUNNER_TEMP}/mise-commit.json" \
            --jq '.data.createCommitOnBranch.commit.url // error("No commit returned")'
          echo "::notice ::Lockfile changes pushed; checks will run on the new commit"
          exit 1
